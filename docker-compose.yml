version: '3.8'

services:
  knowledge-assistant-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-assistant-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - VECTOR_DB_DIR=/app/data/vector_store
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN:-}
      - HF_EMBEDDING_MODEL=${HF_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - HF_LLM_MODEL=${HF_LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}
    volumes:
      # Persist ChromaDB vector store data across container restarts
      - vector_data:/app/data/vector_store
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  vector_data:
    driver: local
